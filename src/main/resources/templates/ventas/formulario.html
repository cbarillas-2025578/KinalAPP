<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Formulario de Ventas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{layout/nav :: menu}"></div>

<main class="main-content">
    <div class="container">
        <header class="content-header">
            <h1 th:text="${venta.codigoVenta} == null ? '➕ Nueva Venta' : '✏️ Editar Venta'}"></h1>
            <a th:href="@{/ventas}" class="btn btn-secondary">← Volver</a>
        </header>

        <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post" class="form">

            <div class="form-group">
                <label>Cliente *</label>
                <select name="clienteDpi" class="form-control" required>
                    <option value="">Seleccione un cliente</option>
                    <option th:each="cliente : ${clientes}"
                            th:value="${cliente.dpiCliente}"
                            th:text="${cliente.nombreCliente + ' ' + cliente.apellidoCliente + ' - ' + cliente.dpiCliente}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Usuario (Vendedor) *</label>
                <select name="usuarioCodigo" class="form-control" required>
                    <option value="">Seleccione un usuario</option>
                    <option th:each="usuario : ${usuarios}"
                            th:value="${usuario.codigoUsuario}"
                            th:text="${usuario.username + ' - ' + usuario.email}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Total *</label>
                <input type="number" step="0.01" name="total" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select name="estado" class="form-control">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Guardar</button>
                <a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
